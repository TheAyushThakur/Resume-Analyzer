services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./.env.example
    environment:
      DEBUG: "False"
      DATABASE_URL: postgresql://jobtracker:jobtracker@db:5432/jobtracker
      CELERY_BROKER_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
      CSRF_TRUSTED_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./.env.example
    environment:
      DEBUG: "False"
      DATABASE_URL: postgresql://jobtracker:jobtracker@db:5432/jobtracker
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    command: celery -A config worker -l info

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  postgres_data:
